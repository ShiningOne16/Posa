name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04   # incluye el SDK de Android preinstalado
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pruebas y APK de depuración
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: Posa-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar APK en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Posa.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Posa.apk \
            --title "Posa (compilación ${{ github.run_number }})" \
            --notes "APK de prueba. Descarga Posa.apk en tu teléfono Android e instálalo." \
            --latest
